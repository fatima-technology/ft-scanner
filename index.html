<style>

@media(min-width:900px){.ed{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.vcol{position:sticky;top:10px}#vw{max-height:76vh}canvas#view{max-height:74vh}}
#fx{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}#fx>div{background:var(--c);border-radius:20px 20px 0 0;padding:14px;width:100%;max-width:480px;max-height:92vh;overflow:auto}#view.sel{outline:3px solid #e11;touch-action:none}

<script>
const $=s=>document.querySelector(s);
let P=[],cur=-1,stream=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
const lastF=()=>{try{return localStorage.getItem('ftf')||'orig'}catch(e){return'orig'}};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---- Camera / Gallery ---- */
$('#bCam').onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}}});
  const v=$('#cam');v.srcObject=stream;v.classList.remove('hide');await v.play();
  $('#bSnap').classList.remove('hide');$('#bCam').classList.add('hide')}
  catch(e){toast('Camera nahi khula. Permission den ya Gallery use karein.')}
};
$('#bSnap').onclick=()=>{
  const v=$('#cam'),c=mk(v.videoWidth,v.videoHeight);c.getContext('2d').drawImage(v,0,0);
  addPage(c,true);toast('Page shamil hua')
};
$('#fImg').onchange=async e=>{
  for(const f of e.target.files){
    const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
    const c=mk(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,0,0);
    addPage(c,false)}
  e.target.value=''
};
function addPage(base,auto){
  const max=2200,s=Math.min(1,max/Math.max(base.width,base.height));
  if(s<1){const n=mk(Math.round(base.width*s),Math.round(base.height*s));n.getContext('2d').drawImage(base,0,0,n.width,n.height);base=n}
  const p={base,f:lastF(),c:[0,0,0,0],k:50,b:50,d:99,v:0};if(auto)p.c=detect(base);
  P.push(p);cur=P.length-1;zoomFit();show();if(auto)fix(p,true)
}

/* ---- Auto edge crop ---- */
function detect(b){
  const w=240,h=Math.round(b.height*w/b.width),c=mk(w,h),x=c.getContext('2d');
  x.drawImage(b,0,0,w,h);const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  const col=new Float32Array(w),row=new Float32Array(h);
  for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){
    const k=y*w+i,m=Math.abs(g[k+1]-g[k-1])+Math.abs(g[k+w]-g[k-w]);
    if(m>60){col[i]++;row[y]++}}
  const first=(a,n)=>{let i=0;while(i<a.length&&a[i]<n*.06)i++;return i},
        last=(a,n)=>{let i=a.length-1;while(i>0&&a[i]<n*.06)i--;return i};
  const l=first(col,h)/w,r=1-last(col,h)/w,t=first(row,w)/h,bt=1-last(row,w)/h;
  const f=v=>Math.max(0,Math.min(45,Math.round(v*100-1)));
  return [f(t),f(bt),f(l),f(r)]
}

/* ---- Render ---- */
function render(p){
  const key=[p.f,p.c,p.k,p.b,p.d,p.v].join('|');
  if(p._k===key)return p._o;
  const [t,bt,l,r]=p.c.map(v=>v/100),B=p.base,
  sx=B.width*l,sy=B.height*t,sw=B.width*(1-l-r),sh=B.height*(1-t-bt),
  o=mk(Math.max(10,Math.round(sw)),Math.max(10,Math.round(sh))),x=o.getContext('2d');
  const F={orig:'',lighten:'brightness(1.3) contrast(.95)',enhance:'contrast(1.4) saturate(1.3)',gray:'grayscale(1) contrast(1.1)',invert:'invert(1)'};
  if(F[p.f]!==undefined)x.filter=((F[p.f]+' contrast('+(p.k/50)+') brightness('+(p.b/50)+')').trim());
  x.drawImage(B,sx,sy,sw,sh,0,0,o.width,o.height);x.filter='none';
  if(['pro','shadow','bw','nowm','eco','nohw'].includes(p.f))clean(o,p);
  if(p.f==='eco'||p.f==='nohw')post(o,p);
  if(p.f==='bw')adaptive(o);
  p._k=key;p._o=o;return o
}
/* Magic Pro: background ko safed karta hai, saaya hatata hai, rang aur likhai barqarar rakhta hai */
function clean(o,p){
  const w=o.width,h=o.height,x=o.getContext('2d'),im=x.getImageData(0,0,w,h),d=im.data;
  const s=Math.max(1,Math.round(Math.max(w,h)/180)),sw=Math.ceil(w/s),sh=Math.ceil(h/s),
  sm=mk(sw,sh),sc=sm.getContext('2d');sc.drawImage(o,0,0,sw,sh);
  const sd=sc.getImageData(0,0,sw,sh).data,R=Math.max(3,Math.round(sw/28)),
  a=new Uint8ClampedArray(sd.length),b=new Uint8ClampedArray(sd.length);
  for(let y=0;y<sh;y++)for(let i=0;i<sw;i++)for(let c=0;c<3;c++){let m=0;
    for(let k=Math.max(0,i-R);k<=Math.min(sw-1,i+R);k++){const v=sd[(y*sw+k)*4+c];if(v>m)m=v}a[(y*sw+i)*4+c]=m}
  for(let y=0;y<sh;y++)for(let i=0;i<sw;i++)for(let c=0;c<3;c++){let m=0;
    for(let k=Math.max(0,y-R);k<=Math.min(sh-1,y+R);k++){const v=a[(k*sw+i)*4+c];if(v>m)m=v}b[(y*sw+i)*4+c]=m}
  for(let i=3;i<b.length;i+=4)b[i]=255;
  const bg=mk(sw,sh);bg.getContext('2d').putImageData(new ImageData(b,sw,sh),0,0);
  const b2=mk(sw,sh),b2x=b2.getContext('2d');b2x.filter='blur('+Math.max(2,R/2)+'px)';b2x.drawImage(bg,0,0);
  const big=mk(w,h),gx=big.getContext('2d');gx.imageSmoothingQuality='high';gx.drawImage(b2,0,0,w,h);
  const bd=gx.getImageData(0,0,w,h).data,lo=({pro:55,nowm:100,eco:60,nohw:55}[p.f]||20)*p.k/50,br=(p.b-50)*1.6,sc2=255/Math.max(40,235-lo);
  for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++){let v=d[i+c]*255/Math.max(1,bd[i+c]);v=(v-lo)*sc2+br;d[i+c]=v<0?0:v>255?255:v}
  x.putImageData(im,0,0);
  if(p.f!=='bw'&&p.d>0){
    const bl=mk(w,h),lx=bl.getContext('2d');lx.filter='blur(1.4px)';lx.drawImage(o,0,0);
    const ld=lx.getImageData(0,0,w,h).data,im2=x.getImageData(0,0,w,h),e=im2.data,am=p.d/100*1.5;
    for(let i=0;i<e.length;i+=4)for(let c=0;c<3;c++){const v=e[i+c]+am*(e[i+c]-ld[i+c]);e[i+c]=v<0?0:v>255?255:v}
    x.putImageData(im2,0,0)}
}
/* Eco: halki siyahi, No Handwriting: rangeen (haath ki) likhai hatao, chhapa hua kaala text rakho */
function post(o,p){
  const x=o.getContext('2d'),im=x.getImageData(0,0,o.width,o.height),d=im.data,th=70-p.k*.8;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];
    if(p.f==='eco'){const v=255-(255-(.3*r+.59*g+.11*b))*.75;d[i]=d[i+1]=d[i+2]=v}
    else if(Math.max(r,g,b)-Math.min(r,g,b)>th){d[i]=d[i+1]=d[i+2]=255}}
  x.putImageData(im,0,0)
}
const FL=[['orig','Original'],['lighten','Lighten'],['enhance','Enhance'],['pro','Magic Pro'],['nowm','No Watermark'],['shadow','No Shadow'],['nohw','No Handwriting'],['bw','B&W'],['eco','Eco'],['gray','Grayscale'],['invert','Invert']];
function thumbs(p){
  const key=[p.c,p.k,p.b,p.d,p.v].join('|');
  if(p._tk!==key){const B=p.base,s=Math.min(1,220/Math.max(B.width,B.height)),sb=mk(Math.round(B.width*s),Math.round(B.height*s));
    sb.getContext('2d').drawImage(B,0,0,sb.width,sb.height);
    p._th=FL.map(([f])=>render({base:sb,f,c:p.c,k:p.k,b:p.b,d:p.d,v:0}));p._tk=key}
  return p._th
}
function buildFilters(p){
  const box=$('#fl'),th=thumbs(p),sl=box.scrollLeft;box.innerHTML='';
  FL.forEach(([f,n],i)=>{const d=document.createElement('div');d.className='fi'+(f===p.f?' on':'');
    const c=mk(70,96),z=c.getContext('2d'),t=th[i],s=Math.min(70/t.width,96/t.height);
    z.fillStyle='#fff';z.fillRect(0,0,70,96);z.drawImage(t,0,0,t.width*s,t.height*s);
    d.appendChild(c);const l=document.createElement('div');l.textContent=n;d.appendChild(l);
    d.onclick=()=>{p.f=f;try{localStorage.setItem('ftf',f)}catch(e){}show()};box.appendChild(d)});
  box.scrollLeft=sl
}
/* ---- OpenCV: page ke 4 kone dhoond kar tirchi photo seedhi karna ---- */
let cvP;
function loadCV(){return cvP||(cvP=new Promise((res,rej)=>{const t=document.createElement('script');t.async=true;
  t.src='https://docs.opencv.org/4.8.0/opencv.js';
  t.onload=()=>{const c=window.cv;if(c&&c.Mat)res();else if(c&&c.then)c.then(m=>{window.cv=m;res()});else if(c)c.onRuntimeInitialized=res;else rej()};
  t.onerror=()=>{cvP=null;rej()};document.head.appendChild(t)}))}
function order(q){const sm=q.map(p=>p[0]+p[1]),df=q.map(p=>p[1]-p[0]);
  return[q[sm.indexOf(Math.min(...sm))],q[df.indexOf(Math.min(...df))],q[sm.indexOf(Math.max(...sm))],q[df.indexOf(Math.max(...df))]]}
function quad(cv,B){
  const s=Math.min(1,600/Math.max(B.width,B.height)),sm=mk(Math.round(B.width*s),Math.round(B.height*s));
  sm.getContext('2d').drawImage(B,0,0,sm.width,sm.height);
  const src=cv.imread(sm),g=new cv.Mat(),e=new cv.Mat(),cs=new cv.MatVector(),hh=new cv.Mat(),k=cv.Mat.ones(5,5,cv.CV_8U);
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,g,new cv.Size(5,5),0);cv.Canny(g,e,50,150);cv.dilate(e,e,k);
  cv.findContours(e,cs,hh,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  let best=null,ba=sm.width*sm.height*.2;
  for(let i=0;i<cs.size();i++){const c=cs.get(i),a=cv.contourArea(c);
    if(a>ba){const ap=new cv.Mat();cv.approxPolyDP(c,ap,.02*cv.arcLength(c,true),true);
      if(ap.rows===4&&cv.isContourConvex(ap)){ba=a;best=[0,1,2,3].map(j=>[ap.data32S[j*2]/s,ap.data32S[j*2+1]/s])}ap.delete()}c.delete()}
  [src,g,e,cs,hh,k].forEach(m=>m.delete());return best
}
function warp(cv,B,q){
  const [tl,tr,br,bl]=order(q),d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),
  W=Math.round(Math.max(d(tl,tr),d(bl,br))),H=Math.round(Math.max(d(tl,bl),d(tr,br))),
  src=cv.imread(B),dst=new cv.Mat(),a=cv.matFromArray(4,1,cv.CV_32FC2,[...tl,...tr,...br,...bl]),
  b=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W,0,W,H,0,H]),M=cv.getPerspectiveTransform(a,b);
  cv.warpPerspective(src,dst,M,new cv.Size(W,H));const o=mk(W,H);cv.imshow(o,dst);
  [src,dst,a,b,M].forEach(m=>m.delete());return o
}
async function fix(p,silent){

const FONTS={sans:'Arial, Helvetica, sans-serif',serif:'Times New Roman, serif',mono:'Courier New, monospace'};
let sel=false,drag=null,S=null;const V=$('#view');
const vpt=e=>{const r=V.getBoundingClientRect();return[(e.clientX-r.left)*V.width/r.width,(e.clientY-r.top)*V.height/r.height]};
const rc=d=>[Math.min(d.a[0],d.b[0]),Math.min(d.a[1],d.b[1]),Math.abs(d.a[0]-d.b[0]),Math.abs(d.a[1]-d.b[1])];

V.onpointermove=e=>{if(!drag)return;drag.b=vpt(e);const x=V.getContext('2d');x.drawImage(render(P[cur]),0,0);
  x.strokeStyle='#e11';x.lineWidth=Math.max(2,V.width/250);x.strokeRect(...rc(drag))};
V.onpointerup=()=>{if(!drag)return;const d=drag;drag=null;sel=false;V.classList.remove('sel');openFx(d)};
async function openFx(d){
  const p=P[cur],[x,y,w,h]=rc(d),ox=p.base.width*p.c[2]/100,oy=p.base.height*p.c[0]/100;
  if(w<8||h<8){show();return toast('Dabba bohat chhota hai')}
  S={x:Math.round(x+ox),y:Math.round(y+oy),w:Math.round(w),h:Math.round(h)};
  S.x=Math.max(0,S.x);S.y=Math.max(0,S.y);S.w=Math.min(S.w,p.base.width-S.x);S.h=Math.min(S.h,p.base.height-S.y);
  const dt=p.base.getContext('2d').getImageData(S.x,S.y,S.w,S.h).data,n=S.w*S.h,L=new Float32Array(n);
  for(let i=0;i<n;i++)L[i]=.3*dt[i*4]+.59*dt[i*4+1]+.11*dt[i*4+2];
  const so=Float32Array.from(L).sort(),bt=so[Math.floor(n*.65)],it=so[Math.floor(n*.08)],B=[0,0,0,0],I=[0,0,0,0];
  for(let i=0;i<n;i++){const T=L[i]>=bt?B:L[i]<=it?I:null;if(T){T[0]+=dt[i*4];T[1]+=dt[i*4+1];T[2]+=dt[i*4+2];T[3]++}}
  const av=T=>[0,1,2].map(k=>Math.round(T[k]/Math.max(1,T[3])));
  const bc=av(B),ic=av(I);S.bg='rgb('+bc+')';S.ink='rgb('+ic+')';
  S.lt=(.3*bc[0]+.59*bc[1]+.11*bc[2]+.3*ic[0]+.59*ic[1]+.11*ic[2])/2;
  // font andaza: har harf ka faasla barabar ho to typewriter/dot-matrix
  const cols=[];for(let i=0;i<S.w;i++){let k=false;for(let j=0;j<S.h;j++)if(L[j*S.w+i]<S.lt){k=true;break}cols.push(k)}
  const st=[];for(let i=1;i<S.w;i++)if(cols[i]&&!cols[i-1])st.push(i);
  const pt=st.slice(1).map((v,i)=>v-st[i]),mu=pt.reduce((a,b)=>a+b,0)/Math.max(1,pt.length),
  sd=Math.sqrt(pt.reduce((a,b)=>a+(b-mu)**2,0)/Math.max(1,pt.length));
  $('#fxf').value=pt.length>=4&&sd/mu<.14?'mono':'sans';
  $('#fxt').value='';$('#fx').style.display='flex';fxPrev();await fxRead()
}
async function fxRead(){
  const b=$('#fxr');b.disabled=true;b.textContent='Parh raha hai...';
  try{const c=mk(S.w*2,S.h*2);c.getContext('2d').drawImage(P[cur].base,S.x,S.y,S.w,S.h,0,0,c.width,c.height);
    const w=await Tesseract.createWorker('eng'),o={tessedit_pageseg_mode:'7'};
    if($('#fxn').checked)o.tessedit_char_whitelist='0123456789.,-/: ';
    await w.setParameters(o);const r=await w.recognize(c);await w.terminate();
    $('#fxt').value=r.data.text.replace(/\s+/g,' ').trim();fxPrev()}
  catch(e){toast('Text nahi parha gaya. Khud likh dein.')}
  b.disabled=false;b.textContent='Dobara parhein'
}
function paintFx(x,ox,oy,sc){
  const t=$('#fxt').value,m=$('#fxs').value/100;x.save();x.fillStyle=S.bg;x.fillRect(ox,oy,S.w*sc,S.h*sc);
  x.fillStyle=S.ink;x.textBaseline='middle';x.font=($('#fxb').checked?'700 ':'400 ')+(S.h*.8*m*sc)+'px '+FONTS[$('#fxf').value];
  const k=Math.max(.7,Math.min(1.4,(S.w*sc)/(x.measureText(t).width||1)));
  x.translate(ox,oy+S.h*sc/2);x.scale(k,1);x.fillText(t,0,0);x.restore()
}
function fxPrev(){const c=$('#fxp');c.width=S.w;c.height=S.h;paintFx(c.getContext('2d'),0,0,1);$('#fxsv').textContent=$('#fxs').value}
['fxt','fxf','fxs','fxb'].forEach(i=>$('#'+i).oninput=fxPrev);$('#fxr').onclick=fxRead;

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function openPdf(f){
  try{toast('PDF khul rahi hai...');const data=new Uint8Array(await f.arrayBuffer());let doc;
    try{doc=await pdfjsLib.getDocument({data:data.slice()}).promise}
    catch(e){if(e.name!=='PasswordException')throw e;const pw=prompt('Is PDF ka password likhein');if(!pw)return;
      doc=await pdfjsLib.getDocument({data:data.slice(),password:pw}).promise}
    const n=Math.min(doc.numPages,80);
    for(let i=1;i<=n;i++){const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),sc=Math.min(3,2200/Math.max(v0.width,v0.height)),
      v=pg.getViewport({scale:sc}),c=mk(Math.round(v.width),Math.round(v.height)),x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;addPage(c,false)}
    $('#name').value=f.name.replace(/\.pdf$/i,'')+'-edit';
    toast(doc.numPages>n?'Pehle 80 pages khule':'PDF khul gayi')}
  catch(e){toast('PDF nahi khuli: '+e.message)}
}
async function openFile(f){
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name))return openPdf(f);
  const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
  const c=mk(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,0,0);addPage(c,false)
}

const zoomBy=f=>{const w=V.getBoundingClientRect().width;V.style.maxWidth='none';V.style.maxHeight='none';V.style.width=Math.max(120,Math.min(V.width*3,w*f))+'px'};

function adaptive(c){
  const x=c.getContext('2d'),w=c.width,h=c.height,im=x.getImageData(0,0,w,h),d=im.data,
  I=new Float64Array((w+1)*(h+1)),g=new Uint8Array(w*h);
  for(let y=0;y<h;y++){let s=0;for(let i=0;i<w;i++){const k=y*w+i,v=.3*d[k*4]+.59*d[k*4+1]+.11*d[k*4+2];g[k]=v;s+=v;I[(y+1)*(w+1)+i+1]=I[y*(w+1)+i+1]+s}}
  const R=Math.max(8,Math.round(Math.min(w,h)/24));
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){
    const x1=Math.max(0,i-R),x2=Math.min(w,i+R+1),y1=Math.max(0,y-R),y2=Math.min(h,y+R+1),
    m=(I[y2*(w+1)+x2]-I[y1*(w+1)+x2]-I[y2*(w+1)+x1]+I[y1*(w+1)+x1])/((x2-x1)*(y2-y1)),
    k=y*w+i,v=g[k]<m*.92?0:255;d[k*4]=d[k*4+1]=d[k*4+2]=v}
  x.putImageData(im,0,0)
}

/* ---- PDF save ---- */
function buildPdf(){
  const pw=$('#pw').value,o={unit:'pt'};if(pw)o.encryption={userPassword:pw,ownerPassword:pw+'-ft',userPermissions:['print']};
  let pdf=null;
  P.forEach((p,i)=>{const c=render(p),s=Math.min(1,1600/Math.max(c.width,c.height)),w=c.width*s*.5,h=c.height*s*.5,
    or=w>h?'l':'p';
    if(i===0)pdf=new jspdf.jsPDF({...o,orientation:or,format:[w,h]});else pdf.addPage([w,h],or);
    pdf.addImage(c.toDataURL('image/jpeg',.85),'JPEG',0,0,w,h)});
  return pdf.output('blob')
}
const fname=()=>($('#name').value.trim()||'Scan')+'.pdf';
const isApk=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function save(blob,n){
  if(isApk()){const fr=new FileReader();fr.onload=async()=>{try{const Pl=Capacitor.Plugins,
    r=await Pl.Filesystem.writeFile({path:n,data:fr.result.split(',')[1],directory:'CACHE'});
    await Pl.Share.share({title:n,url:r.uri,dialogTitle:'Save / Share'})}catch(e){toast('Save nahi hua: '+(e.message||e))}};
    fr.readAsDataURL(blob);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click()
}
$('#bPdf').onclick=()=>{if(!P.length)return;try{save(buildPdf(),fname());toast('PDF save ho gayi')}catch(e){toast('PDF nahi bani: '+e.message)}};
$('#bShare').onclick=async()=>{if(!P.length)return;if(isApk())return save(buildPdf(),fname());const f=new File([buildPdf()],fname(),{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({files:[f]})}catch(e){}else toast('Share is browser mein nahi. Save use karein.')};

/* ---- Merge / Split ---- */
const {PDFDocument}=PDFLib;
$('#bMerge').onclick=async()=>{
  const fs=$('#mf').files;if(fs.length<2)return toast('Kam az kam 2 PDF chunein');
  try{const out=await PDFDocument.create();
    for(const f of fs){const d=await PDFDocument.load(await f.arrayBuffer());(await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p))}
    save(new Blob([await out.save()],{type:'application/pdf'}),'Merged.pdf');toast('Merge ho gayi')}
  catch(e){toast('Merge nahi hui (password wali PDF nahi chalti)')}};
$('#bSplit').onclick=async()=>{
  const f=$('#sf').files[0],r=$('#rng').value;if(!f||!r)return toast('PDF aur pages likhein');
  try{const d=await PDFDocument.load(await f.arrayBuffer()),n=d.getPageCount(),ix=[];
    r.split(',').forEach(s=>{const[a,b]=s.trim().split('-').map(Number);for(let i=a;i<=(b||a);i++)if(i>=1&&i<=n)ix.push(i-1)});
    if(!ix.length)return toast('Pages theek nahi hain');
    const out=await PDFDocument.create();(await out.copyPages(d,ix)).forEach(p=>out.addPage(p));
    save(new Blob([await out.save()],{type:'application/pdf'}),'Split.pdf');toast('Split ho gayi')}
  catch(e){toast('Split nahi hui')}};
